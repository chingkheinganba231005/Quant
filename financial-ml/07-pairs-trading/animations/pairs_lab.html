<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pairs Lab</title>
<style>
:root{--bg:#fff;--ink:#1d2128;--muted:#5d6470;--line:#d9d6cc;--on:#0f6b5c;--on-ink:#fff;--a:#0f6b5c;--b:#3a6fd0;--c:#e08a2c;--bad:#c8372d;--soft:#e2f1ed;color-scheme:light}
:root[data-theme=dark]{--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#77a3f0;--c:#f0a75a;--bad:#f2786e;--soft:#16302b;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#77a3f0;--c:#f0a75a;--bad:#f2786e;--soft:#16302b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;padding:12px 14px;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,system-ui,sans-serif}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}button.on{background:var(--on);border-color:var(--on);color:var(--on-ink)}
.pane{display:none}.pane.on{display:block}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px}label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}label b{color:var(--ink);font-size:13.5px}input[type=range]{width:100%}
svg{width:100%;height:auto;display:block;margin-top:6px}.ax{stroke:var(--line)}.tx{fill:var(--muted);font:11px Inter,sans-serif}.lb{font:600 12px Inter,sans-serif}
.msg{font-size:13.5px;background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:6px}
table{border-collapse:collapse;font:13px Inter,sans-serif;font-variant-numeric:tabular-nums;width:100%;margin-top:6px}th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
</style></head><body>
<div class="tabs"><button class="on" data-t="ou">Trade an OU spread</button><button data-t="sp">Spurious regression</button></div>
<section class="pane on" id="ou">
  <div class="ctl">
    <label>half-life (days): <b id="hlv"></b><input type="range" id="hl" min="2" max="250" value="20"></label>
    <label>random-walk share of the spread: <b id="rwv"></b><input type="range" id="rw" min="0" max="1" step="0.05" value="0"></label>
    <label>entry |z|: <b id="ziv"></b><input type="range" id="zi" min="0.5" max="3.5" step="0.25" value="2"></label>
    <label>exit |z|: <b id="zov"></b><input type="range" id="zo" min="0" max="1.5" step="0.25" value="0.5"></label>
    <label>z-score lookback (days): <b id="lbv"></b><input type="range" id="lb" min="10" max="250" step="5" value="60"></label>
    <label>cost per trade, both legs (bps): <b id="cv"></b><input type="range" id="c" min="0" max="50" value="5"></label>
    <div style="display:flex;align-items:end"><button id="nw">↻ new path</button></div>
  </div>
  <svg id="os" viewBox="0 0 700 330"></svg><table id="ot"></table><div class="msg" id="om"></div>
</section>
<section class="pane" id="sp">
  <div class="ctl">
    <label>days per series: <b id="nv"></b><input type="range" id="n" min="100" max="5000" step="100" value="2500"></label>
    <div style="display:flex;align-items:end;gap:6px"><button id="rg">↻ new pair</button><button id="many">run 500 pairs</button></div>
  </div>
  <svg id="ss" viewBox="0 0 700 260"></svg><div class="msg" id="sm"></div>
</section>
<script>
try{var pt=parent.document.documentElement.dataset.theme;if(pt)document.documentElement.dataset.theme=pt}catch(e){}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id===b.dataset.t)})}});
function $(i){return document.getElementById(i)}var seed=1;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function randn(){var u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function mean(a){var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length}
function sdv(a){var m=mean(a),s=0;for(var i=0;i<a.length;i++)s+=(a[i]-m)*(a[i]-m);return Math.sqrt(s/(a.length-1))}
function pc(v){var r=Math.round(v*100);return(r===0?0:r)+'%'}
function path(pts){return pts.map(function(q,i){return(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('')}
var ouSeed=11;
function drawOU(){var hl=+$('hl').value,rw=+$('rw').value,zi=+$('zi').value,zo=Math.min(+$('zo').value,zi-0.25),lb=+$('lb').value,cb=+$('c').value;
 $('hlv').textContent=hl;$('rwv').textContent=(rw*100).toFixed(0)+'%';$('ziv').textContent=zi.toFixed(2);$('zov').textContent=zo.toFixed(2);$('lbv').textContent=lb;$('cv').textContent=cb;
 // spread in log-price units; OU with daily noise 1%; optional random-walk component (a broken leash)
 var N=2520,phi=Math.exp(-Math.log(2)/hl),sig=0.01,ou=0,walk=0,x=[];seed=ouSeed;
 for(var t=0;t<N;t++){var e1=randn(),e2=randn();ou=phi*ou+sig*e1;walk+=sig*0.35*e2;x.push((1-rw)*ou+rw*walk)}
 // rolling z-score with data up to t only; position decided at close t, earns spread change t->t+1
 var z=new Array(N).fill(null),pos=new Array(N).fill(0),p=0,ntr=0,pnl=[],cost=cb/1e4;
 for(var t=lb;t<N;t++){var w=x.slice(t-lb+1,t+1),m=mean(w),s=sdv(w);z[t]=s>0?(x[t]-m)/s:0;var np=p;
  if(p===0){if(z[t]>zi)np=-1;else if(z[t]<-zi)np=1}else if(p===1&&z[t]>-zo)np=0;else if(p===-1&&z[t]<zo)np=0;
  if(np!==p){ntr+=Math.abs(np-p);}pos[t]=np;p=np}
 var eq=[0],days=0,held=0;for(var t=lb;t<N-1;t++){var r=pos[t]*(x[t+1]-x[t]),ch=Math.abs(pos[t]-(t>lb?pos[t-1]:0))*cost;pnl.push(r-ch);eq.push(eq[eq.length-1]+r-ch);if(pos[t]!==0)held++;days++}
 var W=700,L=44,R=10,X=function(i){return L+(W-L-R)*i/(N-1)},s='';
 // panel 1: spread
 var T1=8,H1=130,lo=Math.min.apply(null,x),hi=Math.max.apply(null,x),Y1=function(v){return T1+H1*(hi-v)/(hi-lo||1)};
 s+='<text class="tx" x="'+L+'" y="'+(T1+10)+'">spread (log units); shaded = in a trade (green long, orange short)</text>';
 var run=null;for(var t=0;t<=N;t++){var q=t<N?pos[t]:0;if(run&&q!==run.q){s+='<rect x="'+X(run.a)+'" y="'+T1+'" width="'+Math.max(1,X(t)-X(run.a))+'" height="'+H1+'" fill="'+(run.q>0?'var(--a)':'var(--c)')+'" opacity=".14"/>';run=null}if(!run&&q!==0)run={a:t,q:q}}
 s+='<path d="'+path(x.map(function(v,i){return[X(i),Y1(v)]}).filter(function(_,i){return i%2===0}))+'" fill="none" stroke="var(--b)" stroke-width="1.2"/>';
 // panel 2: z
 var T2=150,H2=70,zm=Math.max(zi+1,4),Y2=function(v){return T2+H2*(zm-Math.max(-zm,Math.min(zm,v)))/(2*zm)};
 [zi,-zi].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(v)+'" y2="'+Y2(v)+'" stroke="var(--bad)" stroke-dasharray="4 3"/>'});[zo,-zo].forEach(function(v){s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(v)+'" y2="'+Y2(v)+'" stroke="var(--muted)" stroke-dasharray="2 3"/>'});
 s+='<text class="tx" x="'+(L-5)+'" y="'+(Y2(zi)+4)+'" text-anchor="end">+'+zi+'</text><text class="tx" x="'+(L-5)+'" y="'+(Y2(-zi)+4)+'" text-anchor="end">−'+zi+'</text><text class="tx" x="'+L+'" y="'+(T2-2)+'">rolling z-score ('+lb+'-day window)</text>';
 var zp=[];for(var t=lb;t<N;t+=2)zp.push([X(t),Y2(z[t])]);s+='<path d="'+path(zp)+'" fill="none" stroke="var(--muted)" stroke-width="1"/>';
 // panel 3: cumulative P&L
 var T3=240,H3=70,elo=Math.min(0,Math.min.apply(null,eq)),ehi=Math.max(0,Math.max.apply(null,eq)),Y3=function(v){return T3+H3*(ehi-v)/(ehi-elo||1)};
 s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y3(0)+'" y2="'+Y3(0)+'"/><text class="tx" x="'+L+'" y="'+(T3-2)+'">cumulative P&amp;L after costs (log units of one unit of spread)</text>';
 var fin=eq[eq.length-1];s+='<path d="'+path(eq.map(function(v,i){return[X(i+lb),Y3(v)]}).filter(function(_,i){return i%2===0}))+'" fill="none" stroke="'+(fin>=0?'var(--a)':'var(--bad)')+'" stroke-width="2"/>';
 s+='<text class="tx" x="'+(L-5)+'" y="'+(Y3(ehi)+8)+'" text-anchor="end">'+pc(ehi)+'</text><text class="tx" x="'+(L-5)+'" y="'+(Y3(elo)+2)+'" text-anchor="end">'+pc(elo)+'</text>';
 for(var yr=0;yr<=10;yr+=2)s+='<text class="tx" x="'+X(Math.min(N-1,yr*252))+'" y="324" text-anchor="'+(yr===0?'start':yr===10?'end':'middle')+'">yr '+yr+'</text>';
 $('os').innerHTML=s;
 var mu=mean(pnl),sd=sdv(pnl),sh=sd>0?mu/sd*Math.sqrt(252):0,gross=0;for(var t=lb;t<N-1;t++)gross+=pos[t]*(x[t+1]-x[t]);
 $('ot').innerHTML='<tr><th>10 simulated years</th><th>round trips</th><th>time in market</th><th>gross P&amp;L</th><th>costs</th><th>net P&amp;L</th><th>Sharpe (net)</th></tr><tr><td>half-life '+hl+'d'+(rw>0?', '+(rw*100).toFixed(0)+'% walk':'')+'</td><td>'+(ntr/2).toFixed(0)+'</td><td>'+(held/days*100).toFixed(0)+'%</td><td>'+(gross*100).toFixed(1)+'%</td><td>'+((gross-fin)*100).toFixed(1)+'%</td><td>'+(fin*100).toFixed(1)+'%</td><td>'+sh.toFixed(2)+'</td></tr>';
 $('om').innerHTML='A short half-life gives many quick round trips; a long one gives a few slow trades, and then the rolling '+lb+'-day mean chases the spread instead of anchoring it. Raise the <b>random-walk share</b> to cut the leash: the z-score still crosses ±'+zi+', the rule still trades, but there is no force pulling the spread back. Then raise the cost and watch how fast a thin edge disappears.'}
['hl','rw','zi','zo','lb','c'].forEach(function(i){$(i).oninput=drawOU});$('nw').onclick=function(){ouSeed=Math.floor(Math.random()*1e9);drawOU()};drawOU();

// spurious regression
var spSeed=3;
function regress(a,b){var n=a.length,ma=mean(a),mb=mean(b),sab=0,sbb=0;for(var i=0;i<n;i++){sab+=(a[i]-ma)*(b[i]-mb);sbb+=(b[i]-mb)*(b[i]-mb)}var beta=sab/sbb,al=ma-beta*mb,rss=0,tss=0;for(var i=0;i<n;i++){var e=a[i]-al-beta*b[i];rss+=e*e;tss+=(a[i]-ma)*(a[i]-ma)}var se=Math.sqrt(rss/(n-2)/sbb);return{beta:beta,al:al,r2:1-rss/tss,t:beta/se}}
function walks(n){var a=[0],b=[0];for(var i=1;i<n;i++){a.push(a[i-1]+randn());b.push(b[i-1]+randn())}return[a,b]}
function drawSP(){var n=+$('n').value;$('nv').textContent=n;seed=spSeed;var ab=walks(n),a=ab[0],b=ab[1],r=regress(a,b);
 var da=[],db=[];for(var i=1;i<n;i++){da.push(a[i]-a[i-1]);db.push(b[i]-b[i-1])}var rd=regress(da,db);
 var W=700,H=260,L=40,R=10,T=14,B=24,lo=Math.min(Math.min.apply(null,a),Math.min.apply(null,b)),hi=Math.max(Math.max.apply(null,a),Math.max.apply(null,b)),X=function(i){return L+(W-L-R)*i/(n-1)},Y=function(v){return T+(H-T-B)*(hi-v)/(hi-lo||1)};
 var st=Math.max(1,Math.floor(n/700)),pa=[],pb=[],pf=[];for(var i=0;i<n;i+=st){pa.push([X(i),Y(a[i])]);pb.push([X(i),Y(b[i])]);pf.push([X(i),Y(r.al+r.beta*b[i])])}
 var s='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0)+'" y2="'+Y(0)+'"/>';
 s+='<path d="'+path(pa)+'" fill="none" stroke="var(--a)" stroke-width="1.5"/><path d="'+path(pb)+'" fill="none" stroke="var(--c)" stroke-width="1.5"/><path d="'+path(pf)+'" fill="none" stroke="var(--a)" stroke-width="1" stroke-dasharray="4 3" opacity=".7"/>';
 s+='<text class="lb" x="'+(L+6)+'" y="'+(T+10)+'" style="fill:var(--a)">walk A</text><text class="lb" x="'+(L+70)+'" y="'+(T+10)+'" style="fill:var(--c)">walk B</text><text class="tx" x="'+(L+134)+'" y="'+(T+10)+'">dashed: fitted α + β·B</text>';
 s+='<text class="tx" x="'+((W+L)/2)+'" y="'+(H-6)+'" text-anchor="middle">day (0 to '+n+')</text>';
 $('ss').innerHTML=s;
 $('sm').innerHTML='Two <b>independent</b> random walks. Regressing A on B in levels gives β = '+r.beta.toFixed(2)+', R² = <b>'+r.r2.toFixed(2)+'</b>, t-statistic = <b>'+r.t.toFixed(1)+'</b>'+(Math.abs(r.t)>1.96?' (a textbook test calls this “significant”)':'')+'. Regressing their daily <i>changes</i> instead gives R² = '+rd.r2.toFixed(3)+' and t = '+rd.t.toFixed(2)+', the honest answer: no relationship. Click “run 500 pairs” to count how often levels lie.'}
function runMany(){var n=+$('n').value,k=0,kd=0,M=500;seed=12345;for(var j=0;j<M;j++){var ab=walks(n);if(Math.abs(regress(ab[0],ab[1]).t)>1.96)k++;var da=[],db=[];for(var i=1;i<n;i++){da.push(ab[0][i]-ab[0][i-1]);db.push(ab[1][i]-ab[1][i-1])}if(Math.abs(regress(da,db).t)>1.96)kd++}
 $('sm').innerHTML='Out of '+M+' pairs of independent random walks of '+n+' days, the levels regression reported |t| &gt; 1.96 in <b>'+(k/M*100).toFixed(0)+'%</b> of cases (a valid 5% test should say 5%). The regression on daily changes did so in <b>'+(kd/M*100).toFixed(1)+'%</b>. Longer samples make the levels regression <i>more</i> confidently wrong, not less.'}
$('n').oninput=drawSP;$('rg').onclick=function(){spSeed=Math.floor(Math.random()*1e9);drawSP()};$('many').onclick=runMany;drawSP();
</script></body></html>
