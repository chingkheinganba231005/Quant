<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trend Lab</title>
<style>
:root{--bg:#fff;--ink:#1d2128;--muted:#5d6470;--line:#d9d6cc;--on:#0f6b5c;--on-ink:#fff;--a:#0f6b5c;--b:#3a6fd0;--bad:#c8372d;--soft:#f1efe8;color-scheme:light}
:root[data-theme=dark]{--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#77a3f0;--bad:#f2786e;--soft:#20252d;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#77a3f0;--bad:#f2786e;--soft:#20252d;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;padding:12px 14px;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,system-ui,sans-serif}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px 16px}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}label b{color:var(--ink);font-size:13.5px}
input[type=range]{width:100%}
.assets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.assets label{flex-direction:row;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink);cursor:pointer}
.seg{display:flex;gap:6px;flex-wrap:wrap}button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}button.on{background:var(--on);border-color:var(--on);color:var(--on-ink)}
svg{width:100%;height:auto;display:block;margin-top:6px}
.ax{stroke:var(--line)}.tx{fill:var(--muted);font:11px Inter,sans-serif}
table{border-collapse:collapse;font:13px Inter,sans-serif;font-variant-numeric:tabular-nums;margin-top:6px;width:100%}
th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
.note{font-size:12.5px;color:var(--muted);margin-top:6px}
.err{color:var(--bad)}
</style></head><body>
<div class="ctl">
  <label>signal<span class="seg" id="sig"><button data-v="sign" class="on">sign of past return</button><button data-v="avg">average of 1, 3, 12</button></span></label>
  <label>lookback (months): <b id="lv"></b><input type="range" id="lb" min="1" max="24" value="12"></label>
  <label>volatility target per asset: <b id="vv"></b><input type="range" id="vt" min="10" max="60" step="5" value="40"></label>
  <label>cost per trade (bps): <b id="cv"></b><input type="range" id="cost" min="0" max="100" step="5" value="5"></label>
  <label>start year: <b id="sv"></b><input type="range" id="sy" min="2007" max="2020" value="2007"></label>
  <label>positions<span class="seg" id="ls"><button data-v="ls" class="on">long and short</button><button data-v="lo">long only</button></span></label>
</div>
<div class="assets" id="assets"></div>
<svg id="eq" viewBox="0 0 700 250"></svg>
<svg id="dd" viewBox="0 0 700 110"></svg>
<table id="tab"></table>
<p class="note">Monthly version of the chapter’s strategy (no intra-month drift), on real monthly excess returns of the ETFs. Gross leverage is capped at 3. Statistics are in excess of cash. Changing settings until the curve looks great is exactly the multiple-testing trap of Chapter 1.</p>
<script src="data.js"></script>
<script>
try{var pt=parent.document.documentElement.dataset.theme;if(pt)document.documentElement.dataset.theme=pt}catch(e){}
var D=window.TREND_DATA;if(!D){document.body.innerHTML='<p class="err">data.js not found. Run the notebook to export it.</p>'}
var on={};D.assets.forEach(function(a){on[a]=true});var sig='sign',ls='ls';
var box=document.getElementById('assets');D.assets.forEach(function(a){var l=document.createElement('label');l.innerHTML='<input type="checkbox" checked> '+a+' <span style="color:var(--muted)">'+D.names[a]+'</span>';l.querySelector('input').onchange=function(e){on[a]=e.target.checked;run()};box.appendChild(l)});
function segs(id,set){document.querySelectorAll('#'+id+' button').forEach(function(b){b.onclick=function(){set(b.dataset.v);document.querySelectorAll('#'+id+' button').forEach(function(x){x.classList.toggle('on',x===b)});run()}})}
segs('sig',function(v){sig=v});segs('ls',function(v){ls=v});
['lb','vt','cost','sy'].forEach(function(id){document.getElementById(id).oninput=run});
function past(a,t,L){var p=1;for(var k=t-L+1;k<=t;k++){var r=D.ret[a][k];if(r===null||r===undefined)return null;p*=1+r}return p-1}
function stats(r){var n=r.length,m=r.reduce(function(s,x){return s+x},0)/n,v=r.reduce(function(s,x){return s+(x-m)*(x-m)},0)/(n-1),sd=Math.sqrt(v),eq=1,pk=1,mdd=0;r.forEach(function(x){eq*=1+x;pk=Math.max(pk,eq);mdd=Math.min(mdd,eq/pk-1)});return{sh:m/sd*Math.sqrt(12),vol:sd*Math.sqrt(12),cagr:Math.pow(eq,12/n)-1,mdd:mdd}}
function corr(a,b){var n=a.length,ma=0,mb=0;for(var i=0;i<n;i++){ma+=a[i];mb+=b[i]}ma/=n;mb/=n;var c=0,va=0,vb=0;for(i=0;i<n;i++){c+=(a[i]-ma)*(b[i]-mb);va+=(a[i]-ma)*(a[i]-ma);vb+=(b[i]-mb)*(b[i]-mb)}return c/Math.sqrt(va*vb)}
function run(){var L=+lb.value,VT=+vt.value/100,C=+cost.value/1e4,SY=+sy.value;lv.textContent=sig==='avg'?'(1, 3, 12)':L;vv.textContent=(VT*100).toFixed(0)+'%';cv.textContent=cost.value;sv.textContent=SY;
 lb.disabled=sig==='avg';var A=D.assets.filter(function(a){return on[a]}),T=D.dates.length,W=[],out=[],bench=[],dates=[],turn=0,prev=null;
 for(var t=0;t<T;t++){var w={},n=0;A.forEach(function(a){var s=null,vol=D.vol[a][t];if(vol===null||vol===undefined)return;
   if(sig==='avg'){var acc=0,k=0;[1,3,12].forEach(function(LL){var p=past(a,t,LL);if(p!==null){acc+=Math.sign(p);k++}});if(k===3)s=acc/3}else{var p=past(a,t,L);if(p!==null)s=Math.sign(p)}
   if(s===null)return;if(ls==='lo')s=Math.max(0,s);w[a]=s*VT/vol;n++});
  if(n>0){var g=0;for(var a in w){w[a]/=n;g+=Math.abs(w[a])}if(g>3)for(a in w)w[a]*=3/g}
  W.push(n>0?w:null)}
 for(t=1;t<T;t++){var y=+D.dates[t].slice(0,4);if(y<SY)continue;var w=W[t-1];if(!w)continue;var r=0;for(var a in w){var x=D.ret[a][t];if(x!==null&&x!==undefined)r+=w[a]*x}
  var tr=0,pw=prev||{};var keys={};for(a in w)keys[a]=1;for(a in pw)keys[a]=1;for(a in keys)tr+=Math.abs((w[a]||0)-(pw[a]||0));if(!prev)tr=0;prev=w;turn+=tr;
  out.push(r-tr*C);bench.push(D.ret.SPY[t]===null?0:D.ret.SPY[t]);dates.push(D.dates[t])}
 if(out.length<24){tab.innerHTML='<tr><td class="err">Not enough data for these settings.</td></tr>';return}
 var s1=stats(out),s2=stats(bench),mix=out.map(function(x,i){return 0.5*x+0.5*bench[i]}),s3=stats(mix),yrs=out.length/12;
 tab.innerHTML='<tr><th></th><th>Sharpe</th><th>vol</th><th>CAGR</th><th>max DD</th><th>corr SPY</th><th>turnover/yr</th></tr>'+
 [['Trend strategy',s1,corr(out,bench),turn/yrs],['SPY',s2,1,null],['50/50 mix',s3,corr(mix,bench),null]].map(function(r){var s=r[1];return '<tr><td>'+r[0]+'</td><td>'+s.sh.toFixed(2)+'</td><td>'+(s.vol*100).toFixed(1)+'%</td><td>'+(s.cagr*100).toFixed(1)+'%</td><td>'+(s.mdd*100).toFixed(0)+'%</td><td>'+r[2].toFixed(2)+'</td><td>'+(r[3]===null?'':r[3].toFixed(1)+'×')+'</td></tr>'}).join('');
 plot(out,bench,dates)}
function plot(a,b,dates){var Wd=700,H=250,L=44,Rr=10,T=10,B=24;function eqs(r){var e=1,o=[1];r.forEach(function(x){e*=1+x;o.push(e)});return o}var ea=eqs(a),eb=eqs(b),all=ea.concat(eb),lo=Math.log(Math.min.apply(null,all)),hi=Math.log(Math.max.apply(null,all));
 function X(i){return L+(Wd-L-Rr)*i/(ea.length-1)}function Y(v){return T+(H-T-B)*(hi-Math.log(v))/(hi-lo||1)}
 var s='',ticks=[0.5,1,2,3,4,6,8];ticks.forEach(function(v){if(Math.log(v)>=lo-0.01&&Math.log(v)<=hi+0.01)s+='<line class="ax" x1="'+L+'" x2="'+(Wd-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="tx" x="'+(L-5)+'" y="'+(Y(v)+4)+'" text-anchor="end">$'+v+'</text>'});
 for(var i=0;i<dates.length;i+=24)s+='<text class="tx" x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">'+dates[i].slice(0,4)+'</text>';
 function path(e,c,w){return '<path d="'+e.map(function(v,i){return(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)}).join('')+'" fill="none" stroke="'+c+'" stroke-width="'+w+'"/>'}
 s+=path(eb,'var(--b)',1.4)+path(ea,'var(--a)',2)+'<text class="tx" x="'+(L+6)+'" y="'+(T+12)+'" style="fill:var(--a);font-weight:600">trend strategy</text><text class="tx" x="'+(L+110)+'" y="'+(T+12)+'" style="fill:var(--b);font-weight:600">SPY</text>';
 document.getElementById('eq').innerHTML=s;
 var H2=110,ddA=[],pk=0;ea.forEach(function(v){pk=Math.max(pk,v);ddA.push(v/pk-1)});var ddB=[];pk=0;eb.forEach(function(v){pk=Math.max(pk,v);ddB.push(v/pk-1)});var mn=Math.min(Math.min.apply(null,ddA),Math.min.apply(null,ddB),-0.05);
 function Y2(v){return 6+(H2-24)*(v/mn)}var s2='<line class="ax" x1="'+L+'" x2="'+(Wd-Rr)+'" y1="6" y2="6"/><text class="tx" x="'+(L-5)+'" y="10" text-anchor="end">0%</text><text class="tx" x="'+(L-5)+'" y="'+(Y2(mn)+4)+'" text-anchor="end">'+(mn*100).toFixed(0)+'%</text>';
 function area(dd,c,o){return '<path d="M'+X(0)+' 6'+dd.map(function(v,i){return 'L'+X(i).toFixed(1)+' '+Y2(v).toFixed(1)}).join('')+'L'+X(dd.length-1)+' 6Z" fill="'+c+'" opacity="'+o+'"/>'}
 s2+=area(ddB,'var(--b)',0.25)+area(ddA,'var(--a)',0.45)+'<text class="tx" x="'+(Wd-Rr)+'" y="'+(H2-4)+'" text-anchor="end">drawdowns</text>';document.getElementById('dd').innerHTML=s2}
var lb=document.getElementById('lb'),vt=document.getElementById('vt'),cost=document.getElementById('cost'),sy=document.getElementById('sy'),lv=document.getElementById('lv'),vv=document.getElementById('vv'),cv=document.getElementById('cv'),sv=document.getElementById('sv'),tab=document.getElementById('tab');
run();
</script></body></html>
