<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GARCH Lab</title>
<style>
:root{--bg:#fff;--ink:#1d2128;--muted:#5d6470;--line:#d9d6cc;--on:#0f6b5c;--on-ink:#fff;--a:#0f6b5c;--b:#e08a2c;--c:#3a6fd0;--bad:#c8372d;--soft:#e2f1ed;color-scheme:light}
:root[data-theme=dark]{--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#f0a75a;--c:#77a3f0;--bad:#f2786e;--soft:#16302b;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#f0a75a;--c:#77a3f0;--bad:#f2786e;--soft:#16302b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;padding:12px 14px;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,system-ui,sans-serif}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px}
label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}label b{color:var(--ink);font-size:13.5px}input[type=range]{width:100%}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer}button.on{background:var(--on);border-color:var(--on);color:var(--on-ink)}
svg{width:100%;height:auto;display:block}.ax{stroke:var(--line)}.tx{fill:var(--muted);font:11px Inter,sans-serif}.lb{font:600 12px Inter,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:620px){.grid{grid-template-columns:1fr}}
.msg{font-size:13.5px;background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:6px}
</style></head><body>
<div class="ctl">
  <label>α (reaction to shocks): <b id="av"></b><input type="range" id="a" min="0" max="0.3" step="0.005" value="0.08"></label>
  <label>β (memory): <b id="bv"></b><input type="range" id="b" min="0.5" max="0.995" step="0.005" value="0.90"></label>
  <label>γ (extra reaction to bad news): <b id="gv"></b><input type="range" id="g" min="0" max="0.3" step="0.005" value="0.0"></label>
  <label>long-run volatility: <b id="lv"></b><input type="range" id="lr" min="5" max="40" value="18"></label>
</div>
<div class="row"><span style="font-size:12.5px;color:var(--muted);align-self:center">presets:</span><span id="presets"></span><button id="ns">↻ new random shocks</button><button id="sh">inject a −8% crash on day 600</button></div>
<svg id="sim" viewBox="0 0 700 230"></svg>
<div class="grid"><svg id="nic" viewBox="0 0 340 220"></svg><svg id="fc" viewBox="0 0 340 220"></svg></div>
<div class="msg" id="msg"></div>
<script src="data.js"></script>
<script>
try{var pt=parent.document.documentElement.dataset.theme;if(pt)document.documentElement.dataset.theme=pt}catch(e){}
var seed=3,crash=false;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function randn(){var u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function $(i){return document.getElementById(i)}var base=Math.floor(Math.random()*1e6);
var P=window.GARCH_PRESETS||{};var pre=$('presets');
function addPreset(name,p){var b=document.createElement('button');b.textContent=name;b.onclick=function(){var pers=p.alpha+p.beta+p.gamma/2;$('a').value=p.alpha;$('b').value=p.beta;$('g').value=p.gamma;$('lr').value=Math.round(Math.sqrt(p.omega/(1-pers)*252)*100);draw()};pre.appendChild(b)}
Object.keys(P).forEach(function(k){addPreset(k,P[k])});addPreset('EWMA-like (no mean reversion)',{alpha:0.06,beta:0.935,gamma:0,omega:1e-7});addPreset('no clustering',{alpha:0,beta:0.5,gamma:0,omega:(0.18*0.18/252)*0.5});
function draw(){var a=+$('a').value,b=+$('b').value,g=+$('g').value,lr=+$('lr').value/100;$('av').textContent=a.toFixed(3);$('bv').textContent=b.toFixed(3);$('gv').textContent=g.toFixed(3);$('lv').textContent=(lr*100).toFixed(0)+'%';
 var pers=a+b+g/2,ok=pers<1;if(!ok){$('msg').innerHTML='<b style="color:var(--bad)">α + β + γ/2 = '+pers.toFixed(3)+' ≥ 1: the variance explodes (not stationary). Lower α, β or γ.</b>';return}
 var sbar=lr*lr/252,om=sbar*(1-pers),n=1200,s2=sbar,r=[],sig=[];seed=base;
 for(var t=0;t<n;t++){var z=randn();if(crash&&t===600)z=-0.08/Math.sqrt(s2);var e=Math.sqrt(s2)*z;r.push(e);sig.push(Math.sqrt(s2*252));s2=om+(a+g*(e<0?1:0))*e*e+b*s2}
 // simulation plot
 var W=700,H=230,L=40,T=8,B=20,mid=(H-B+T)/2,mx=Math.max.apply(null,r.map(Math.abs)),vm=Math.max.apply(null,sig);
 var s='<line class="ax" x1="'+L+'" x2="'+W+'" y1="'+mid+'" y2="'+mid+'"/>';for(t=0;t<n;t++){var x=L+(W-L)*t/n,h=(mid-T)*r[t]/mx;s+='<line x1="'+x.toFixed(1)+'" x2="'+x.toFixed(1)+'" y1="'+mid+'" y2="'+(mid-h).toFixed(1)+'" stroke="var(--muted)" stroke-width="0.6" opacity=".7"/>'}
 s+='<path d="'+sig.map(function(v,t){return(t?'L':'M')+(L+(W-L)*t/n).toFixed(1)+' '+(H-B-(H-B-T)*v/vm).toFixed(1)}).join('')+'" fill="none" stroke="var(--b)" stroke-width="1.6"/>';
 s+='<text class="tx" x="'+(L-4)+'" y="'+(T+10)+'" text-anchor="end">'+(vm*100).toFixed(0)+'%</text><text class="lb" x="'+(L+6)+'" y="'+(T+12)+'" style="fill:var(--b)">volatility σ (annualised)</text><text class="lb" x="'+(L+6)+'" y="'+(H-B-6)+'" style="fill:var(--muted)">daily returns (grey)</text><text class="tx" x="'+W+'" y="'+(H-4)+'" text-anchor="end">1,200 simulated days</text>';$('sim').innerHTML=s;
 // news impact curve
 var W2=340,H2=220,L2=44,B2=30,T2=12,es=[],vs=[],vs0=[];for(var k=-60;k<=60;k++){var e=k/1000;es.push(e);vs.push(Math.sqrt((om+(a+g*(e<0?1:0))*e*e+b*sbar)*252));vs0.push(lr)}var vmx=Math.max.apply(null,vs)*1.05;
 function X2(e){return L2+(W2-L2-8)*(e+0.06)/0.12}function Y2(v){return H2-B2-(H2-B2-T2)*v/vmx}
 var s2v='<line class="ax" x1="'+L2+'" x2="'+(W2-8)+'" y1="'+(H2-B2)+'" y2="'+(H2-B2)+'"/><line class="ax" x1="'+X2(0)+'" x2="'+X2(0)+'" y1="'+T2+'" y2="'+(H2-B2)+'"/>';
 s2v+='<path d="'+es.map(function(e,i){return(i?'L':'M')+X2(e).toFixed(1)+' '+Y2(vs[i]).toFixed(1)}).join('')+'" fill="none" stroke="var(--a)" stroke-width="2"/>';
 s2v+='<text class="tx" x="'+X2(-0.06)+'" y="'+(H2-B2+14)+'">−6%</text><text class="tx" x="'+X2(0.06)+'" y="'+(H2-B2+14)+'" text-anchor="end">+6%</text><text class="tx" x="'+(L2-4)+'" y="'+(Y2(vmx/1.05)+4)+'" text-anchor="end">'+(vmx/1.05*100).toFixed(0)+'%</text><text class="lb" x="'+(L2+4)+'" y="'+(T2+10)+'" style="fill:var(--a)">news impact curve</text><text class="tx" x="'+((W2+L2)/2)+'" y="'+(H2-4)+'" text-anchor="middle">today’s shock → tomorrow’s σ</text>';$('nic').innerHTML=s2v;
 // forecast term structure from the current state
 var s2now=Math.pow(sig[n-1],2)/252,fh=[],hi=[],lo=[];for(k=1;k<=252;k++){fh.push(Math.sqrt((sbar+Math.pow(pers,k-1)*(s2now-sbar))*252));hi.push(Math.sqrt((sbar+Math.pow(pers,k-1)*(3*sbar-sbar))*252));lo.push(Math.sqrt((sbar+Math.pow(pers,k-1)*(0.3*sbar-sbar))*252))}
 var fm=Math.max(Math.max.apply(null,hi),Math.max.apply(null,fh))*1.05;function X3(k){return L2+(W2-L2-8)*(k-1)/251}function Y3(v){return H2-B2-(H2-B2-T2)*v/fm}
 function pth(arr,c,w,d){return '<path d="'+arr.map(function(v,i){return(i?'L':'M')+X3(i+1).toFixed(1)+' '+Y3(v).toFixed(1)}).join('')+'" fill="none" stroke="'+c+'" stroke-width="'+w+'"'+(d?' stroke-dasharray="4 3"':'')+'/>'}
 var hl=Math.log(0.5)/Math.log(pers),s3='<line class="ax" x1="'+L2+'" x2="'+(W2-8)+'" y1="'+(H2-B2)+'" y2="'+(H2-B2)+'"/><line x1="'+L2+'" x2="'+(W2-8)+'" y1="'+Y3(lr)+'" y2="'+Y3(lr)+'" stroke="var(--muted)" stroke-dasharray="2 3"/>'+pth(hi,'var(--c)',1.3,true)+pth(lo,'var(--c)',1.3,true)+pth(fh,'var(--b)',2.2);
 s3+='<text class="lb" x="'+(L2+4)+'" y="'+(T2+10)+'" style="fill:var(--b)">forecast σ for day k ahead</text><text class="tx" x="'+(W2-8)+'" y="'+(Y3(lr)-4)+'" text-anchor="end">long run '+(lr*100).toFixed(0)+'%</text><text class="tx" x="'+((W2+L2)/2)+'" y="'+(H2-4)+'" text-anchor="middle">days ahead (dashed: starting from a crisis or a calm)</text>';$('fc').innerHTML=s3;
 var ac=0,ac2=0,m=0;r.forEach(function(x){m+=x*x});m/=n;for(t=1;t<n;t++){ac+=(r[t]*r[t]-m)*(r[t-1]*r[t-1]-m)}var vv=0;r.forEach(function(x){vv+=(x*x-m)*(x*x-m)});
 var kurt=r.reduce(function(s,x){return s+x*x*x*x},0)/n/(m*m);
 $('msg').innerHTML='persistence α+β+γ/2 = <b>'+pers.toFixed(3)+'</b> → a shock to volatility halves in <b>'+(isFinite(hl)?hl.toFixed(0):'∞')+' days</b>. Simulated returns: kurtosis <b>'+kurt.toFixed(1)+'</b> (normal = 3), lag-1 autocorrelation of r² = <b>'+(ac/vv).toFixed(2)+'</b>. GARCH creates fat tails and clustering from normal shocks alone.'}
['a','b','g','lr'].forEach(function(i){$(i).oninput=draw});$('ns').onclick=function(){base=Math.floor(Math.random()*1e6);draw()};$('sh').onclick=function(){crash=!crash;$('sh').classList.toggle('on',crash);draw()};draw();
</script></body></html>
