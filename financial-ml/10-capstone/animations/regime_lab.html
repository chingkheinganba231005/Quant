<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Regime Lab</title>
<style>
:root{--bg:#fff;--ink:#1d2128;--muted:#5d6470;--line:#d9d6cc;--on:#0f6b5c;--on-ink:#fff;--a:#0f6b5c;--b:#3a6fd0;--c:#e08a2c;--bad:#c8372d;--soft:#e2f1ed;color-scheme:light}
:root[data-theme=dark]{--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#77a3f0;--c:#f0a75a;--bad:#f2786e;--soft:#16302b;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--a:#4fc7ad;--b:#77a3f0;--c:#f0a75a;--bad:#f2786e;--soft:#16302b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;padding:12px 14px;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,system-ui,sans-serif}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}button.on{background:var(--on);border-color:var(--on);color:var(--on-ink)}
.pane{display:none}.pane.on{display:block}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px}label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}label b{color:var(--ink);font-size:13.5px}input[type=range]{width:100%}
select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
svg{width:100%;height:auto;display:block;margin-top:6px}.ax{stroke:var(--line)}.tx{fill:var(--muted);font:11px Inter,sans-serif}.lb{font:600 12px Inter,sans-serif}
.msg{font-size:13.5px;background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:6px}
table{border-collapse:collapse;font:13px Inter,sans-serif;font-variant-numeric:tabular-nums;width:100%;margin-top:6px}th,td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right}th:first-child,td:first-child{text-align:left}
</style></head><body>
<div class="tabs"><button class="on" data-t="re">Regimes on SPY</button><button data-t="si">HMM simulator</button></div>
<section class="pane on" id="re">
  <div class="ctl">
    <label>probabilities<select id="pk"><option value="pf">filtered, walk-forward (tradeable)</option><option value="ps">smoothed, full sample (look-ahead!)</option></select></label>
    <label>exposure when turbulent (floor): <b id="flv"></b><input type="range" id="fl" min="0" max="1" step="0.05" value="0"></label>
    <label>no-trade band: <b id="bdv"></b><input type="range" id="bd" min="0" max="0.5" step="0.05" value="0.1"></label>
    <label>cost (bps per unit traded): <b id="csv"></b><input type="range" id="cs" min="0" max="20" step="1" value="2"></label>
  </div>
  <svg id="res" viewBox="0 0 700 290"></svg><table id="ret"></table><div class="msg" id="rem"></div>
</section>
<section class="pane" id="si">
  <div class="ctl">
    <label>calm stays calm (per day): <b id="a0v"></b><input type="range" id="a0" min="0.9" max="0.999" step="0.001" value="0.99"></label>
    <label>turbulent stays turbulent: <b id="a1v"></b><input type="range" id="a1" min="0.8" max="0.995" step="0.005" value="0.97"></label>
    <label>volatility ratio (turbulent / calm): <b id="vrv"></b><input type="range" id="vr" min="1.1" max="5" step="0.1" value="3"></label>
    <div style="display:flex;align-items:end"><button id="sn">↻ new history</button></div>
  </div>
  <svg id="sis" viewBox="0 0 700 280"></svg><div class="msg" id="sim"></div>
</section>
<script src="data.js"></script>
<script>
try{var pt=parent.document.documentElement.dataset.theme;if(pt)document.documentElement.dataset.theme=pt}catch(e){}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id===b.dataset.t)})}});
function $(i){return document.getElementById(i)}
function path(pts){return pts.map(function(q,i){return(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('')}
var D=window.REGIME_DATA,n=D.dates.length;
function stats(x,rf,i0,i1){var m=0,mr=0,c=0;for(var i=i0;i<i1;i++){m+=x[i];mr+=x[i]-rf[i];c++}m/=c;mr/=c;var v=0,ve=0;for(i=i0;i<i1;i++){v+=(x[i]-m)*(x[i]-m);ve+=(x[i]-rf[i]-mr)*(x[i]-rf[i]-mr)}
 var e=1,pk=1,dd=0;for(i=i0;i<i1;i++){e*=1+x[i];pk=Math.max(pk,e);dd=Math.min(dd,e/pk-1)}return{ret:m*252,vol:Math.sqrt(v/(c-1)*252),sh:mr/Math.sqrt(ve/(c-1))*Math.sqrt(252),dd:dd}}
var split=D.dates.findIndex(function(d){return d>='2021-01-01'});
function drawRE(){var pk=$('pk').value,fl=+$('fl').value,bd=+$('bd').value,cs=+$('cs').value/1e4;$('flv').textContent=fl.toFixed(2);$('bdv').textContent=bd.toFixed(2);$('csv').textContent=$('cs').value;
 var p=D[pk],x=new Array(n),cur=1-(1-fl)*p[0],prev=0,held=0;
 for(var i=0;i<n;i++){x[i]=held*D.r[i]+(1-held)*D.rf[i]-Math.abs(cur-prev)*cs*(i>0?1:0);prev=cur;var t=1-(1-fl)*p[i];if(Math.abs(t-cur)>bd)cur=t;held=cur}
 // note: decision at the close of day i (prob of day i) earns day i+1
 var W=700,H=290,L=44,R=10,T=12,B=26,eqS=[1],eqX=[1];for(i=0;i<n;i++){eqS.push(eqS[i]*(1+D.r[i]));eqX.push(eqX[i]*(1+x[i]))}
 var lo=Math.log(Math.min(Math.min.apply(null,eqS),Math.min.apply(null,eqX))),hi=Math.log(Math.max(Math.max.apply(null,eqS),Math.max.apply(null,eqX))),X=function(i){return L+(W-L-R)*i/n},Y=function(v){return T+(H-T-B)*(hi-Math.log(v))/(hi-lo)},s='';
 for(i=0;i<n;i+=3){if(p[i]>0.05)s+='<rect x="'+X(i)+'" y="'+T+'" width="'+((W-L-R)*3/n+0.3)+'" height="'+(H-T-B)+'" fill="var(--bad)" opacity="'+(0.22*p[i]).toFixed(3)+'"/>'}
 [0.5,1,2,4,8].forEach(function(v){if(Math.log(v)>=lo-0.01&&Math.log(v)<=hi+0.01)s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'"/><text class="tx" x="'+(L-5)+'" y="'+(Y(v)+4)+'" text-anchor="end">$'+v+'</text>'});
 s+='<line x1="'+X(split)+'" x2="'+X(split)+'" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--ink)" stroke-dasharray="4 3"/><text class="tx" x="'+(X(split)+4)+'" y="'+(T+10)+'">hold-out →</text>';
 var st=Math.max(1,Math.floor(n/700));function pp(eq){var q=[];for(var i=0;i<=n;i+=st)q.push([X(i),Y(eq[i])]);return q}
 s+='<path d="'+path(pp(eqS))+'" fill="none" stroke="var(--b)" stroke-width="1.6"/><path d="'+path(pp(eqX))+'" fill="none" stroke="var(--a)" stroke-width="2.2"/>';
 s+='<text class="lb" x="'+(L+8)+'" y="'+(T+14)+'" style="fill:var(--b)">SPY</text><text class="lb" x="'+(L+48)+'" y="'+(T+14)+'" style="fill:var(--a)">regime strategy</text><text class="tx" x="'+(L+160)+'" y="'+(T+14)+'">red shading: P(turbulent)</text>';
 for(var yr=2008;yr<=2026;yr+=3){var k=D.dates.findIndex(function(d){return d>=yr+'-01-01'});if(k>=0)s+='<text class="tx" x="'+X(k)+'" y="'+(H-8)+'" text-anchor="middle">'+yr+'</text>'}
 $('res').innerHTML=s;
 var rows=[['SPY, 2007–2020',stats(D.r,D.rf,0,split)],['strategy, 2007–2020',stats(x,D.rf,0,split)],['SPY, hold-out 2021–2026',stats(D.r,D.rf,split,n)],['strategy, hold-out',stats(x,D.rf,split,n)]];
 $('ret').innerHTML='<tr><th></th><th>annual return</th><th>vol</th><th>Sharpe (excess)</th><th>max drawdown</th></tr>'+rows.map(function(r){var o=r[1];return'<tr><td>'+r[0]+'</td><td>'+(o.ret*100).toFixed(1)+'%</td><td>'+(o.vol*100).toFixed(1)+'%</td><td>'+o.sh.toFixed(2)+'</td><td>'+(o.dd*100).toFixed(0)+'%</td></tr>'}).join('');
 $('rem').innerHTML=pk==='ps'?'<b>Look-ahead!</b> These probabilities come from a model fitted on all the data and smoothed with the future. The equity curve is what most regime-switching tutorials show; no one could have traded it.':'Filtered probabilities from a model refitted each January on past data only: this is what a trader could have known. Raise the floor to stay partly invested in turbulent markets, widen the band to trade less, and watch the hold-out row: the drawdown benefit survives much better than the Sharpe advantage.'}
['pk','fl','bd','cs'].forEach(function(i){$(i).oninput=drawRE;$(i).onchange=drawRE});drawRE();
// ---------- simulator
var seed=5,sSeed=21;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function randn(){var u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
function npdf(x,m,s){return Math.exp(-0.5*((x-m)/s)*((x-m)/s))/s}
function drawSI(){var a0=+$('a0').value,a1=+$('a1').value,vr=+$('vr').value;$('a0v').textContent=a0.toFixed(3);$('a1v').textContent=a1.toFixed(3);$('vrv').textContent=vr.toFixed(1);
 var N=1500,mu=[0.05,-0.08],sd=[0.8,0.8*vr],z=[0],x=[],pr=[],a=[1,0];seed=sSeed;
 for(var t=1;t<N;t++)z.push(z[t-1]===0?(rnd()<1-a0?1:0):(rnd()<a1?1:0));
 for(t=0;t<N;t++)x.push(mu[z[t]]+sd[z[t]]*randn());
 for(t=0;t<N;t++){var p0=(t?a[0]*a0+a[1]*(1-a1):1)*npdf(x[t],mu[0],sd[0]),p1=(t?a[0]*(1-a0)+a[1]*a1:0)*npdf(x[t],mu[1],sd[1]),s=p0+p1;a=[p0/s,p1/s];pr.push(a[1])}
 var W=700,H=280,L=40,R=10,T1=10,H1=130,T2=165,H2=85,X=function(i){return L+(W-L-R)*i/(N-1)},xm=Math.max.apply(null,x.map(Math.abs)),Y1=function(v){return T1+H1/2-H1/2*v/xm},Y2=function(v){return T2+H2*(1-v)},s='';
 var run=null;for(t=0;t<=N;t++){var q=t<N?z[t]:0;if(run!==null&&q===0){s+='<rect x="'+X(run)+'" y="'+T1+'" width="'+(X(t)-X(run))+'" height="'+(T2+H2-T1)+'" fill="var(--bad)" opacity=".1"/>';run=null}if(run===null&&q===1)run=t}
 for(t=0;t<N;t++)s+='<line x1="'+X(t).toFixed(1)+'" x2="'+X(t).toFixed(1)+'" y1="'+Y1(0).toFixed(1)+'" y2="'+Y1(x[t]).toFixed(1)+'" stroke="'+(z[t]?'var(--bad)':'var(--b)')+'" stroke-width="0.6"/>';
 s+='<text class="tx" x="'+L+'" y="'+(T1+10)+'">simulated daily returns (red: truly turbulent days)</text>';
 s+='<line class="ax" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y2(0.5)+'" y2="'+Y2(0.5)+'" stroke-dasharray="3 3"/><path d="'+path(pr.map(function(v,i){return[X(i),Y2(v)]}))+'" fill="none" stroke="var(--a)" stroke-width="1.5"/>';
 s+='<text class="tx" x="'+(L-5)+'" y="'+(Y2(1)+4)+'" text-anchor="end">1</text><text class="tx" x="'+(L-5)+'" y="'+(Y2(0)+4)+'" text-anchor="end">0</text><text class="tx" x="'+L+'" y="'+(T2-4)+'">filtered P(turbulent), using the true parameters</text>';
 $('sis').innerHTML=s;
 var corr=0,starts=0,det=0,delay=0;for(t=0;t<N;t++)if((pr[t]>0.5?1:0)===z[t])corr++;
 for(t=1;t<N;t++)if(z[t]===1&&z[t-1]===0){starts++;var e=t;while(e<N&&z[e]===1)e++;for(var k=t;k<e;k++)if(pr[k]>0.5){det++;delay+=k-t;break}}
 $('sim').innerHTML='Days classified correctly: <b>'+(corr/N*100).toFixed(1)+'%</b>. Turbulent spells: '+starts+', detected (P &gt; 0.5 before they ended): '+det+(det?', on average <b>'+(delay/det).toFixed(1)+' days</b> after they began':'')+'. Expected spell lengths: calm '+(1/(1-a0)).toFixed(0)+' days, turbulent '+(1/(1-a1)).toFixed(0)+' days. Shrink the volatility ratio towards 1 and the filter goes blind; shorten the turbulent spells and they are over before the filter notices. Even with the <i>true</i> parameters, a filter can only react.'}
['a0','a1','vr'].forEach(function(i){$(i).oninput=drawSI});$('sn').onclick=function(){sSeed=Math.floor(Math.random()*1e9);drawSI()};drawSI();
</script></body></html>
