<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Lab</title>
<style>
:root{--bg:#fff;--ink:#1d2128;--muted:#5d6470;--line:#d9d6cc;--on:#0f6b5c;--on-ink:#fff;--tr:#3a6fd0;--te:#e08a2c;--pu:#c8372d;--em:#9b59b6;--soft:#e2f1ed;color-scheme:light}
:root[data-theme=dark]{--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--tr:#77a3f0;--te:#f0a75a;--pu:#f2786e;--em:#c39bdc;--soft:#16302b;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#181c22;--ink:#e7e9ee;--muted:#a2a9b6;--line:#2e343e;--on:#4fc7ad;--on-ink:#0c1512;--tr:#77a3f0;--te:#f0a75a;--pu:#f2786e;--em:#c39bdc;--soft:#16302b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;padding:12px 14px;background:var(--bg);color:var(--ink);font:14.5px/1.45 Inter,system-ui,sans-serif}
.tabs{display:flex;gap:6px;margin-bottom:10px}button{font:inherit;font-size:13.5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:5px 13px;cursor:pointer}button.on{background:var(--on);border-color:var(--on);color:var(--on-ink)}
.pane{display:none}.pane.on{display:block}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 16px}label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted)}label b{color:var(--ink);font-size:13.5px}input[type=range]{width:100%}
svg{width:100%;height:auto;display:block;margin-top:6px}.tx{fill:var(--muted);font:11px Inter,sans-serif}
.msg{font-size:13.5px;background:var(--soft);border-radius:8px;padding:8px 12px;margin-top:6px}
.key span{display:inline-block;width:12px;height:12px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
</style></head><body>
<div class="tabs"><button class="on" data-t="pg">Purge &amp; embargo</button><button data-t="tb">Triple barrier</button></div>
<section class="pane on" id="pg">
  <div class="ctl">
    <label>label horizon h (days): <b id="hv"></b><input type="range" id="h" min="1" max="15" value="6"></label>
    <label>test fold (of 5): <b id="fv"></b><input type="range" id="f" min="1" max="5" value="3"></label>
    <label>embargo (days): <b id="ev"></b><input type="range" id="e" min="0" max="10" value="3"></label>
  </div>
  <div class="key" style="font-size:12.5px;margin-top:6px"><span style="background:var(--tr)"></span>train<span style="background:var(--te)"></span>test<span style="background:var(--pu)"></span>purged (overlaps the test labels)<span style="background:var(--em)"></span>embargoed</div>
  <svg id="ps" viewBox="0 0 700 300"></svg><div class="msg" id="pm"></div>
</section>
<section class="pane" id="tb">
  <div class="ctl">
    <label>upper barrier (× σ√h): <b id="uv"></b><input type="range" id="ku" min="0.25" max="3" step="0.25" value="1"></label>
    <label>lower barrier (× σ√h): <b id="dv"></b><input type="range" id="kd" min="0.25" max="3" step="0.25" value="1"></label>
    <label>vertical barrier h (days): <b id="tv"></b><input type="range" id="th" min="5" max="60" value="21"></label>
    <div style="display:flex;align-items:end"><button id="np">↻ new paths</button></div>
  </div>
  <svg id="ts" viewBox="0 0 700 300"></svg><div class="msg" id="tm"></div>
</section>
<script>
try{var pt=parent.document.documentElement.dataset.theme;if(pt)document.documentElement.dataset.theme=pt}catch(e){}
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b)});document.querySelectorAll('.pane').forEach(function(p){p.classList.toggle('on',p.id===b.dataset.t)})}});
function $(i){return document.getElementById(i)}
function drawPurge(){var h=+$('h').value,f=+$('f').value,e=+$('e').value;$('hv').textContent=h;$('fv').textContent=f;$('ev').textContent=e;
 var n=40,W=700,H=300,L=30,R=10,T=10,rowH=(H-T-30)/n,X=function(d){return L+(W-L-R)*d/(n+h+1)};var fold=Math.floor(n/5),lo=(f-1)*fold,hi=f*fold-1,tlo=lo,thi=hi+h,s='',nt=0,np=0,ne=0,ntest=hi-lo+1;
 for(var d=0;d<=n+h;d+=5)s+='<line x1="'+X(d)+'" x2="'+X(d)+'" y1="'+T+'" y2="'+(H-24)+'" stroke="var(--line)"/><text class="tx" x="'+X(d)+'" y="'+(H-10)+'" text-anchor="middle">day '+d+'</text>';
 s+='<rect x="'+X(tlo)+'" y="'+T+'" width="'+(X(thi+1)-X(tlo))+'" height="'+(H-T-24)+'" fill="var(--te)" opacity=".08"/>';
 for(var i=0;i<n;i++){var a=i,b=i+h,col,kind;if(i>=lo&&i<=hi){col='var(--te)';kind='test'}else if(b>=tlo&&a<=thi){col='var(--pu)';kind='purged';np++}else if(a>thi&&a<=thi+e){col='var(--em)';kind='emb';ne++}else{col='var(--tr)';kind='train';nt++}
  var y=T+i*rowH;s+='<rect x="'+X(a)+'" y="'+(y+1)+'" width="'+Math.max(2,X(b+1)-X(a))+'" height="'+Math.max(2,rowH-2)+'" rx="2" fill="'+col+'" opacity="'+(kind==='train'?0.55:0.9)+'"/>'}
 $('ps').innerHTML=s;$('pm').innerHTML='Each bar is one sample: it starts on its day and its label uses the next <b>'+h+'</b> days. Test fold '+f+' has '+ntest+' samples. <b>'+np+'</b> training samples are purged because their labels overlap the test labels, <b>'+ne+'</b> are embargoed, and <b>'+nt+'</b> remain for training. With h = 1 almost nothing is purged; with long horizons, purging costs real data, and skipping it leaks the answers.'}
['h','f','e'].forEach(function(i){$(i).oninput=drawPurge});drawPurge();
var seed=5;function rnd(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}
function randn(){var u=0,v=0;while(u===0)u=rnd();while(v===0)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}var base=9;
function drawTB(){var ku=+$('ku').value,kd=+$('kd').value,h=+$('th').value;$('uv').textContent=ku.toFixed(2);$('dv').textContent=kd.toFixed(2);$('tv').textContent=h;
 var sig=0.01,w=sig*Math.sqrt(h),W=700,H=300,L=46,R=10,T=12,B=26,P=24,ymax=3.2*w,X=function(j){return L+(W-L-R)*j/60},Y=function(v){return T+(H-T-B)*(ymax-v)/(2*ymax)};
 var s='<rect x="'+X(0)+'" y="'+Y(ku*w)+'" width="'+(X(h)-X(0))+'" height="'+(Y(-kd*w)-Y(ku*w))+'" fill="var(--soft)" stroke="var(--muted)" stroke-dasharray="4 3"/>';
 s+='<text class="tx" x="'+(L-4)+'" y="'+(Y(ku*w)+4)+'" text-anchor="end">+'+(ku*w*100).toFixed(1)+'%</text><text class="tx" x="'+(L-4)+'" y="'+(Y(-kd*w)+4)+'" text-anchor="end">−'+(kd*w*100).toFixed(1)+'%</text><text class="tx" x="'+X(h)+'" y="'+(H-8)+'" text-anchor="middle">h = '+h+'</text>';
 seed=base;var cnt={up:0,dn:0,vu:0,vd:0},hold=0;
 for(var p=0;p<P;p++){var x=0,pts=[[0,0]],lab=null,jhit=h;for(var j=1;j<=60;j++){x+=sig*randn();pts.push([j,x]);if(lab===null&&j<=h){if(x>=ku*w){lab='up';jhit=j}else if(x<=-kd*w){lab='dn';jhit=j}}}
  if(lab===null){lab=pts[h][1]>=0?'vu':'vd'}cnt[lab]++;hold+=jhit;var col=lab==='up'||lab==='vu'?'var(--on)':'var(--pu)';
  s+='<path d="'+pts.filter(function(q){return Math.abs(q[1])<ymax}).map(function(q,i){return(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)}).join('')+'" fill="none" stroke="'+col+'" stroke-width="1" opacity=".35"/>';
  s+='<circle cx="'+X(jhit)+'" cy="'+Y(pts[jhit][1])+'" r="3.5" fill="'+col+'"/>'}
 $('ts').innerHTML=s;$('tm').innerHTML='Out of '+P+' random-walk paths: <b>'+cnt.up+'</b> hit the upper barrier first (+1), <b>'+cnt.dn+'</b> the lower one (−1), and '+(cnt.vu+cnt.vd)+' reached the vertical barrier (labelled by the sign of their return: '+cnt.vu+' up, '+cnt.vd+' down). Average holding: '+(hold/P).toFixed(1)+' days. Widen the upper barrier and positive labels become rarer: the base rate a model must beat changes with the barrier choice.'}
['ku','kd','th'].forEach(function(i){$(i).oninput=drawTB});$('np').onclick=function(){base=Math.floor(Math.random()*1e9);drawTB()};drawTB();
</script></body></html>
